[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-multiplex-analyzer"
version = "0.1.0"
description = "連続切片 WSI の Virtual Multiplex 病理解析デスクトップアプリ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0 WITH Commons-Clause" }
authors = [{ name = "Takahiro Motoyama" }]
keywords = ["pathology", "WSI", "DeepLIIF", "registration", "multiplex"]

dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "SimpleITK>=2.3",
    "openslide-python>=1.3",
    "tifffile>=2023.7",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
# 任意機能。未導入でも mock フォールバックで動作する。
deepliif = ["deepliif>=1.1"]
napari = ["napari>=0.4.18"]
dev = ["pytest>=7.4", "pytest-qt>=4.2"]

[project.gui-scripts]
vmpa = "app:main"

[tool.setuptools]
py-modules = ["app"]
packages = ["gui", "modules", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py311"]
